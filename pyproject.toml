[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlscheduler"
version = "0.1.0"
description = "Tabular Q-learning for dynamic multi-server job scheduling, benchmarked against round-robin and greedy heuristics."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Thakur Ajay Kumar" }]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
